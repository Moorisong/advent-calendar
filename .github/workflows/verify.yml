name: Verify Dear Choco

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check conventions
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build production assets
        run: npm run build
