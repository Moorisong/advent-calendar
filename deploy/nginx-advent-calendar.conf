# ==============================================================================
# advent-calendar Nginx Configuration
# Domain: advent-calendar.harooo.co.kr
# Root: /home/ksh/srv/advent-calendar/dist
# ==============================================================================

server {
    server_name advent-calendar.harooo.co.kr;
    root /home/ksh/srv/advent-calendar/dist;
    index index.html;
    charset utf-8;

    # Basic hardening
    server_tokens off;
    autoindex off;

    # Rate Limiting & Connection Limiting (shared zone from /etc/nginx/conf.d/dumpit-rate-limit.conf)
    limit_req zone=dumpit_per_ip burst=60 nodelay;
    limit_req_status 429;
    limit_conn dumpit_conn_per_ip 30;
    limit_conn_status 429;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy (Allows Supabase Auth/DB/Edge Functions, Kakao Login & Share SDK)
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://t1.kakaocdn.net https://*.kakaocdn.net https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https://lrpehigfvwddizepghnc.supabase.co wss://lrpehigfvwddizepghnc.supabase.co https://*.supabase.co wss://*.supabase.co https://kauth.kakao.com https://kapi.kakao.com https://*.kakaocdn.net https:; frame-src 'self' https://*.kakao.com https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests;" always;

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block sensitive files, source maps, development source, and dotfiles
    location ~* \.(map|ts|tsx|jsx|sql|sh|md|log|bak|env.*|json)$ {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/myorok.harooo.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myorok.harooo.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = advent-calendar.harooo.co.kr) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name advent-calendar.harooo.co.kr;
    return 404;
}

